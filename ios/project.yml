# 拾景 iOS 遥控端的 XcodeGen 描述。改了这里或增删了源文件，在 ios/ 下运行 `xcodegen` 重新生成 ShiJing.xcodeproj。
name: ShiJing
options:
  bundleIdPrefix: com.love1017best
  # 界面只有中文：开发语言设成简体中文，系统按钮和日期格式（Locale.current）才会是中文
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.3.9" # 与桌面端 desktop/mygo.json 的 version 一致
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
# 开发团队 ID 写在本地的 ShiJing/Local.xcconfig（已 gitignore，不进公开仓库），Signing.xcconfig 可选地引用它
configFiles:
  Debug: ShiJing/Signing.xcconfig
  Release: ShiJing/Signing.xcconfig
targets:
  ShiJing:
    type: application
    platform: iOS
    sources:
      - path: ShiJing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.love1017best.shijing.ios
        PRODUCT_NAME: 拾景
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ShiJing/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 拾景
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 拾景要在局域网里找到你的 Mac，并遥控上面的拾景换壁纸。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
