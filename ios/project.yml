# 拾景 iOS 遥控端的 XcodeGen 描述。改了这里或增删了源文件，在 ios/ 下运行 `xcodegen` 重新生成 ShiJing.xcodeproj。
name: ShiJing
options:
  bundleIdPrefix: com.love1017best
  # 界面只有中文：开发语言设成简体中文，系统按钮和日期格式（Locale.current）才会是中文
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.3.122" # 与桌面端 desktop/mygo.json 的 version 一致
    CURRENT_PROJECT_VERSION: "122"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
# 开发团队 ID 写在本地的 ShiJing/Local.xcconfig（已 gitignore，不进公开仓库），Signing.xcconfig 可选地引用它
configFiles:
  Debug: ShiJing/Signing.xcconfig
  Release: ShiJing/Signing.xcconfig
targets:
  ShiJing:
    type: application
    platform: iOS
    sources:
      - path: ShiJing
      # 小组件的界面也编进 App，Debug 下的 -demoWidgets 演示页用
      - path: ShiJingWidget/WidgetViews.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.love1017best.shijing.ios
        PRODUCT_NAME: 拾景
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ShiJing/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 拾景
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 拾景要在局域网里找到你的 Mac，并遥控上面的拾景换壁纸。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 把壁纸的原图存到相册。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 和小组件共用钥匙串（配对令牌、选中的 Mac）：免费签名没有 App Groups，钥匙串共享可以用
        CODE_SIGN_ENTITLEMENTS: ShiJing/ShiJing.entitlements
      configs:
        # 发布 / 装到手机的是 Release：去掉调试符号（包从 6 MB 多降到 2 MB 左右）
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          # 小组件界面编进 App 只给 Debug 的 -demoWidgets 演示页用
          EXCLUDED_SOURCE_FILE_NAMES: WidgetViews.swift
    dependencies:
      - target: ShiJingWidget
  ShiJingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ShiJingWidget
      # 和 App 共用：接口、模型、钥匙串、快捷指令操作、换完通知
      - path: ShiJing/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.love1017best.shijing.ios.widget
        PRODUCT_NAME: ShiJingWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 拾景
        CODE_SIGN_ENTITLEMENTS: ShiJingWidget/ShiJingWidget.entitlements
        SKIP_INSTALL: YES
      configs:
        # 发布 / 装到手机的是 Release：去掉调试符号（包从 6 MB 多降到 2 MB 左右）
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
    info:
      path: ShiJingWidget/Info.plist
      properties:
        CFBundleDisplayName: 拾景
        ShiJingKeychainGroup: $(AppIdentifierPrefix)com.love1017best.shijing.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
