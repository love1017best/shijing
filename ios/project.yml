# 拾景 iOS 遥控端的 XcodeGen 描述。改了这里或增删了源文件，在 ios/ 下运行 `xcodegen` 重新生成 ShiJing.xcodeproj。
name: ShiJing
options:
  bundleIdPrefix: com.love1017best
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.3.6" # 与桌面端 desktop/mygo.json 的 version 一致
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # 免费的个人开发者账号：第一次在 Xcode 的 Signing & Capabilities 里选自己的 Personal Team
    DEVELOPMENT_TEAM: ""
targets:
  ShiJing:
    type: application
    platform: iOS
    sources:
      - path: ShiJing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.love1017best.shijing.ios
        PRODUCT_NAME: 拾景
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ShiJing/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 拾景
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 拾景要在局域网里找到你的 Mac，并遥控上面的拾景换壁纸。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
